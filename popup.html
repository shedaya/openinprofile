<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 230px;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 13px; color: #1e293b;
    }
    .header {
      background: #1e3a5f; color: #fff;
      padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .header span { font-weight: 600; font-size: 13px; }
    .header button {
      background: none; border: none; color: rgba(255,255,255,0.7);
      font-size: 11px; cursor: pointer; padding: 0; font-family: inherit;
    }
    .header button:hover { color: #fff; }
    .list { padding: 4px 0; }
    .profile-btn {
      display: block; width: 100%; text-align: left;
      background: none; border: none; padding: 9px 14px;
      cursor: pointer; font-size: 13px; color: #1e293b;
      font-family: inherit;
    }
    .profile-btn:hover { background: #f1f5f9; }
    .empty {
      padding: 16px 14px; color: #64748b; font-size: 12px;
      text-align: center; line-height: 1.6;
    }
    .empty button {
      display: inline-block; margin-top: 8px;
      background: #1e3a5f; color: #fff; border: none;
      border-radius: 6px; padding: 6px 12px;
      font-size: 12px; cursor: pointer; font-family: inherit;
    }
    .divider {
      border: none; border-top: 1px solid #e2e8f0; margin: 0;
    }
    .install-toggle {
      display: flex; align-items: center; gap: 7px; width: 100%;
      background: none; border: none; padding: 8px 14px;
      cursor: pointer; font-size: 12px; color: #64748b;
      font-family: inherit;
    }
    .install-toggle:hover { background: #f1f5f9; color: #1e3a5f; }
    .install-toggle .chevron {
      display: inline-block; transition: transform 0.15s; font-size: 9px; color: #94a3b8;
    }
    .install-toggle[aria-expanded="true"] .chevron { transform: rotate(90deg); }
    .install-btns { display: none; padding-bottom: 4px; }
    .install-btns.open { display: block; }
    .install-btn {
      display: block; width: 100%; text-align: left;
      background: none; border: none;
      padding: 7px 14px 7px 31px;
      cursor: pointer; font-size: 12px; color: #64748b;
      font-family: inherit;
    }
    .install-btn b { color: #1e293b; font-weight: 600; }
    .install-btn:hover { background: #f1f5f9; color: #1e3a5f; }
    .install-btn:disabled { color: #16a34a; cursor: default; }
    .install-btn:disabled:hover { background: none; }
  </style>
</head>
<body>
  <div class="header">
    <span>⇄ Open in Profile</span>
    <button id="manageBtn">Manage profiles</button>
  </div>
  <div id="list" class="list"></div>
  <div id="installSection" style="display:none">
    <button id="installToggle" class="install-toggle" aria-expanded="false">
      <span class="chevron">▸</span> Install in other profiles
    </button>
    <div id="installBtns" class="install-btns"></div>
  </div>
  <hr class="divider">
  <div style="text-align:center; padding:8px 14px; font-size:11px; color:#94a3b8">
    Enjoying it? <a id="reviewLinkPopup" href="#" target="_blank" style="color:#2d6a9f; text-decoration:none">Leave a review ↗</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: zip -r open-in-profile.zip native-host/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: open-in-profile.zip
          generate_release_notes: true
